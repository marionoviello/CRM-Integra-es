[project]
name = "noviello-funil-saude"
version = "0.1.0"
description = "Atendente IA Saúde — Jurichat <-> Claude"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    # tzdata: necessário no Windows (em Linux/Mac o zoneinfo usa o sistema).
    # ~500KB pure-python, importação só em calendar_client.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
noviello-followup = "noviello_funil.scheduler:main"
noviello-relatorio = "noviello_funil.relatorio:main"
noviello-aniversarios = "noviello_funil.aniversarios:main"
noviello-publicacoes = "noviello_funil.publicacoes:main"
noviello-saude-carteira = "noviello_funil.saude_carteira:main"
noviello-indice = "noviello_funil.person_index:main"
noviello-bounce = "noviello_funil.detector_bounce:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noviello_funil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
